name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Assets Manually
        run: |
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><title>SmartPOS BD</title></head><body style="font-family:sans-serif;text-align:center;padding:50px;"><h1 style="color:#059669;">SmartPOS BD</h1><p>Cloud POS & Inventory SaaS for Bangladesh</p></body></html>' > dist/index.html

      - name: Create Capacitor Project & Build APK
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npx cap init "SmartPOS BD" "bd.smartpos.app" --web-dir dist --yes
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPOS-BD-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
